<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Document</title>
</head>

<body>
    <div class="buttons">
        <button id="new-game">Start new game</button>
    </div>
    <!-- <div class="enemy-deck deck"></div> -->
    <!-- <div class="enemy-card-slot card-slot">
    </div> -->
    <!-- <div class="text"></div> -->
    <!-- <div class="player-deck deck"></div>
    <div class="player-card-slot card-slot">
    
    </div> -->

    <div class="container">
        <div class="round-buttons">
            <button id="end-turn" disabled>End turn</button>
            <button id="end-round">End round</button>
            <button id="next-round" class="d-none">Next round</button>
        </div>
        <div class="enemy-deck deck"></div>
        <div class="card-field">

            <div class="card-wrapper">
                <div class="round-stats enemy-stats">
                    <span>Enemy stats:</span>
                    <div></div>
                </div>
                <div class="enemy-card-slot card-slot"></div>
            </div>
            <div class="text-wrapper">
                <div class="text"></div>
            </div>
            <div class="card-wrapper">
                <div class="round-stats player-stats">
                    <span>Player stats:</span>
                    <div></div>
                </div>
                <div class="player-card-slot card-slot"></div>
            </div>
        </div>
        <div class="player-deck deck"></div>
    </div>

</body>


<script type="module" src="./assets/js/main.js" defer></script>
</html>
